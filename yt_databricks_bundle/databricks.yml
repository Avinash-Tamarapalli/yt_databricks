# This is a Databricks asset bundle definition for yt_databricks_bundle.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: yt_databricks_bundle
  uuid: ad4584d5-b29d-4b38-af9d-b8014b0ec610

include:
  - resources/*.yml
  - resources/*/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-9070505d-d246.cloud.databricks.com
    variables:
      catalog: yt_dev
      schema: dev
    presets:
      artifacts_dynamic_version: true
  prod:
    mode: production
    workspace:
      host: https://dbc-9070505d-d246.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/avinash12082001@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/avinash12082001@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: yt_dev
      schema: prod
    permissions:
      - user_name: avinash12082001@gmail.com
        level: CAN_MANAGE
