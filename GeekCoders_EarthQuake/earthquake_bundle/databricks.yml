# This is a Databricks asset bundle definition for earthquake_bundle.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: earthquake_bundle
  uuid: b95182c1-bc61-4449-a090-fa785480f82a

include:
  - resources/*.yml
  - resources/*/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use
  volume:
    description: The volume where earthquake json is located

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-9070505d-d246.cloud.databricks.com
    variables:
      catalog: yt_dev
      schema: bronze_dev
      volume: earthquake_volume
  prod:
    mode: production
    workspace:
      host: https://dbc-9070505d-d246.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/avinash12082001@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/avinash12082001@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: yt_dev
      schema: prod
    permissions:
      - user_name: avinash12082001@gmail.com
        level: CAN_MANAGE
