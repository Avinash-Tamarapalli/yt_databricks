resources:
  jobs:
    earthquake_ingestion_job:
      name: earthquake_ingestion_job

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}

      tasks:
        - task_key: notebook_task
          notebook_task:
            notebook_path: ../src/earthquake_ingestion_notebooks/earthquake_weekly_summary_ingestion.ipynb
        - task_key: refresh_pipeline
          depends_on:
            - task_key: notebook_task
          pipeline_task:
            pipeline_id: ${resources.pipelines.earthquake_bundle_etl.id}

      environments:
        - environment_key: default
          spec:
            environment_version: "4"
